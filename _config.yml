# Site settings
title: Between Code and Math
author:
  name: Prasanna Maddila
description: "The site of Prasanna Maddila."
url: https://prasanna.maddila.cc

# generic settings
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false

# Build settings
remote_theme: jekyll/minima@3cdd14d
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one

# Get the dark mode
minima:
    skin: dark

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

header_pages:
    - news.md
    - blog.md

